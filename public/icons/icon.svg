<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono de la app: un vinilo con etiqueta roja sobre fondo oscuro (colores de styles.scss).
       Fuente de los PNG de public/icons (se generan con tools/make-icons.js). -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2a221c"/>
      <stop offset="1" stop-color="#0b0907"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C44B3F"/>
      <stop offset="1" stop-color="#C8984C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0e0b09"/>
  <circle cx="256" cy="256" r="206" fill="url(#disc)" stroke="#C8984C" stroke-opacity=".5" stroke-width="4"/>
  <g fill="none" stroke="#E6B86A" stroke-opacity=".13" stroke-width="2">
    <circle cx="256" cy="256" r="176"/>
    <circle cx="256" cy="256" r="158"/>
    <circle cx="256" cy="256" r="140"/>
    <circle cx="256" cy="256" r="122"/>
    <circle cx="256" cy="256" r="104"/>
  </g>
  <!-- Reflejo de luz sobre los surcos -->
  <path d="M120 150A170 170 0 0 1 250 88" fill="none" stroke="#E6B86A" stroke-opacity=".45" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="78" fill="url(#label)"/>
  <circle cx="256" cy="256" r="11" fill="#0e0b09"/>
</svg>
