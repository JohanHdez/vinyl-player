name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias (cliente) y del servidor
        run: npm test
      - name: Build de producción
        run: npm run build

  docker:
    # Construye la misma imagen que usará Railway y comprueba que arranca.
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t vinyl-player .
      - name: Arrancar y revisar /api/health
        run: |
          docker run -d --name vinyl -p 3001:3001 -e DATA_DIR=/data vinyl-player
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then echo; echo "OK"; exit 0; fi
            sleep 2
          done
          docker logs vinyl
          exit 1
      - name: La app responde en /
        run: curl -fsS http://localhost:3001/ | grep -q "<app-root>"
