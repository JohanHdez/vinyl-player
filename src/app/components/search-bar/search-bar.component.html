<div class="search-section">
  <div class="search-input-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input
      #input
      type="search"
      class="search-input"
      placeholder="Busca una canción, un artista o pega un enlace de YouTube"
      aria-label="Buscar música"
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      (keydown)="onKeydown($event)"
      (focus)="focused.set(true)"
      (blur)="focused.set(false)"
      autocomplete="off"
    />
    @if (query()) {
      <button type="button" class="search-clear" (click)="clear()" aria-label="Borrar búsqueda">
        <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    }
  </div>

  @if (query() && query().trim().length < minLength) {
    <p class="search-hint">Sigue escribiendo… busco desde {{ minLength }} letras</p>
  } @else if (!query() && recent().length) {
    <div class="search-recent" aria-label="Búsquedas recientes">
      <span>Recientes:</span>
      @for (term of recent(); track term) {
        <button type="button" class="recent-chip" (mousedown)="pick(term)">{{ term }}</button>
      }
    </div>
  }
</div>
