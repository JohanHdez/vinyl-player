@if (isOpen) {
  <div class="jam-join-overlay" (click)="close()">
    <div class="jam-join-dialog" role="dialog" aria-modal="true" aria-labelledby="join-title" (click)="$event.stopPropagation()">
      <div class="dialog-header" id="join-title">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        Te invitaron a una sala
      </div>

      <div class="dialog-body">
        <p class="join-explain">La música suena en el dispositivo de quien creó la sala. Desde tu celular pides canciones, votas y chateas.</p>

        <label class="field-label" for="join-name">Tu nombre</label>
        <input id="join-name" type="text" class="field-input" placeholder="¿Cómo te llamamos?" [(ngModel)]="name" maxlength="30" (keydown.enter)="join()" autofocus />

        <label class="field-label" for="join-code">Código de la sala</label>
        <input id="join-code" type="text" class="field-input field-code" placeholder="ABC123" [(ngModel)]="code" maxlength="6" (keydown.enter)="join()" />

        <label class="join-listen">
          <input type="checkbox" [checked]="jam.listenHere()" (change)="jam.setListenHere($any($event.target).checked)" />
          🎧 Escuchar también en este dispositivo (con audífonos)
        </label>

        <p class="join-terms">Al entrar aceptas los <a href="/?view=terminos" target="_blank" rel="noopener">términos de uso</a>.</p>
      </div>

      <div class="dialog-actions">
        <button class="cancel-btn" (click)="close()">Cancelar</button>
        <button class="join-btn" (click)="join()" [disabled]="!code.trim()">Entrar a la sala</button>
      </div>
    </div>
  </div>
}
